<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>까위키</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand" onclick="openDoc('대문')">까위키</div>
  <div class="sub">누구나 편집할 수 있는 수상한 백과사전</div>
  <div class="search"><input id="q" placeholder="문서 검색"><button onclick="search()">검색</button></div>
</header>
<nav>
  <a onclick="openDoc('대문')">대문</a>
  <a onclick="recent()">최근 변경</a>
  <a onclick="randomDoc()">랜덤 문서</a>
  <a onclick="allDocs()">모든 문서</a>
  <a onclick="about()">까위키 소개</a>
</nav>
<div class="layout">
<aside>
  <h3>문서</h3>
  <button onclick="edit()">✏️ 편집</button>
  <button onclick="history()">🕘 역사</button>
  <button onclick="discussion()">💬 토론</button>
  <h3>둘러보기</h3>
  <button onclick="openDoc('대문')">대문</button>
  <button onclick="allDocs()">모든 문서</button>
  <button onclick="categories()">분류</button>
  <div class="warning"><b>주의</b><br>까위키의 내용은 사실이 아닐 수도 있습니다.</div>
</aside>
<main id="app"></main>
</div>
<footer>까위키 v3 · 무료 웹 배포판</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
